<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Step 3C - Task Dashboard</title>
<style>
body { font-family: Arial, sans-serif; background: #f4f6f8; padding: 20px; }
h2 { text-align: center; color: #333; margin-bottom: 20px; }
#taskSummaryContainer { background: #fff; padding: 20px; border-radius: 10px; max-width: 1000px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
th, td { border: 1px solid #ccd1d9; padding: 10px; text-align: left; }
th { background-color: #007bff; color: white; }
tr:nth-child(even) { background: #f9f9f9; }
tr:hover { background: #e6f0ff; }
button { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-right: 5px; }
#addTaskBtn { background-color: #28a745; color: white; }
#addTaskBtn:hover { background-color: #218838; }
#updateSelectedBtn { background-color: #ffc107; color: #000; }
#updateSelectedBtn:hover { background-color: #e0a800; }
.deleteBtn { background-color: #dc3545; color: white; }
.deleteBtn:hover { background-color: #c82333; }
</style>
</head>
<body>

<div id="taskSummaryContainer">
<h2>Task Dashboard - Step 3C</h2>

<button id="addTaskBtn" onclick="goToAddTask()">Add New Task</button>

<table>
    <thead>
        <tr>
            <th>Select</th>
            <th>ID</th>
            <th>Title</th>
            <th>Description</th>
            <th>Category</th>
            <th>Status</th>
            <th>Priority</th>
            <th>Due Date</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="taskSummaryBody"></tbody>
</table>

<button id="updateSelectedBtn" onclick="updateSelectedTask()">Update Selected Task</button>
</div>

<script>
let taskList3C = [];

function loadTasks3C() {
    const saved = localStorage.getItem("taskList");
    if (saved) taskList3C = JSON.parse(saved);
}

function displayTasks3C() {
    const tbody = document.getElementById("taskSummaryBody");
    tbody.innerHTML = "";

    taskList3C.forEach(task => {
        // Completed task-lar dashboard-da görünməsin
        if (task.status === "Completed") return;

        const rowHTML = `
        <tr>
            <td><input type="radio" name="selectedTask" value="${task.id}"></td>
            <td>${task.id}</td>
            <td>${task.title}</td>
            <td>${task.description}</td>
            <td>${task.category}</td>
            <td>${task.status}</td>
            <td>${task.priority}</td>
            <td>${task.dueDate || ""}</td>
            <td>
                <button class="deleteBtn" onclick="deleteTask(${task.id})">Delete</button>
            </td>
        </tr>`;
        tbody.insertAdjacentHTML("beforeend", rowHTML);
    });
}

function goToAddTask() {
    window.location.href = "index.html";
}

function updateSelectedTask() {
    const selected = document.querySelector('input[name="selectedTask"]:checked');
    if (!selected) {
        alert("Please select a task to update.");
        return;
    }
    localStorage.setItem("updateTaskId", selected.value);
    window.location.href = "step3d.html";
}

function deleteTask(taskId) {
    if (confirm("Are you sure you want to delete this task?")) {
        taskList3C = taskList3C.filter(task => task.id != taskId);
        localStorage.setItem("taskList", JSON.stringify(taskList3C));
        displayTasks3C();
    }
}

document.addEventListener("DOMContentLoaded", () => {
    loadTasks3C();
    displayTasks3C();
});
</script>
</body>
</html>
